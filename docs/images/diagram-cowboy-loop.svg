<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="ringbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0A14"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="loopgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5A0"/>
      <stop offset="100%" stop-color="#FF6B1A"/>
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="url(#ringbg)"/>
  <g fill="#FFF" opacity="0.4">
    <circle cx="40" cy="30" r="0.7"/>
    <circle cx="600" cy="40" r="0.8"/>
  </g>
  <!-- The 6-step cowboy loop, drawn as a circle -->
  <g filter="url(#glow6)">
    <circle cx="320" cy="160" r="115" fill="none" stroke="url(#loopgrad)" stroke-width="2.5" stroke-dasharray="6 4"/>
  </g>
  <!-- 6 stations around the circle, in clockwise order -->
  <g font-family="ui-sans-serif,system-ui" font-size="10" font-weight="bold" text-anchor="middle">
    <!-- 1. pincher (top) -->
    <circle cx="320" cy="45"  r="28" fill="#0A0A14" stroke="#FF6B1A" stroke-width="2"/>
    <text x="320" y="42" fill="#FFE5A0">pincher</text>
    <text x="320" y="55" fill="#FF9A3C" font-size="8" font-style="italic">reflex</text>
    <!-- 2. substrate (top-right) -->
    <circle cx="420" cy="103" r="28" fill="#0A0A14" stroke="#10B981" stroke-width="2"/>
    <text x="420" y="100" fill="#FFE5A0">substrate</text>
    <text x="420" y="113" fill="#D1FAE5" font-size="8" font-style="italic">data</text>
    <!-- 3. saddle (bottom-right) -->
    <circle cx="420" cy="217" r="28" fill="#0A0A14" stroke="#A855F7" stroke-width="2"/>
    <text x="420" y="214" fill="#FFE5A0">saddle</text>
    <text x="420" y="227" fill="#F3E8FF" font-size="8" font-style="italic">record</text>
    <!-- 4. cowboy (bottom) -->
    <circle cx="320" cy="275" r="28" fill="#0A0A14" stroke="#FFE5A0" stroke-width="2"/>
    <text x="320" y="272" fill="#FFE5A0">cowboy</text>
    <text x="320" y="285" fill="#FF9A3C" font-size="8" font-style="italic">morning</text>
    <!-- 5. reactor (bottom-left) -->
    <circle cx="220" cy="217" r="28" fill="#0A0A14" stroke="#DC2626" stroke-width="2"/>
    <text x="220" y="214" fill="#FFE5A0">reactor</text>
    <text x="220" y="227" fill="#FEE2E2" font-size="8" font-style="italic">real-time</text>
    <!-- 6. witness (top-left) -->
    <circle cx="220" cy="103" r="28" fill="#0A0A14" stroke="#3B82F6" stroke-width="2"/>
    <text x="220" y="100" fill="#FFE5A0">witness</text>
    <text x="220" y="113" fill="#E0E7FF" font-size="8" font-style="italic">remember</text>
  </g>
  <!-- arrows around the loop -->
  <g stroke="#FFE5A0" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 350,55  A 115,115 0 0,1 420,75"/>
    <path d="M 433,128 A 115,115 0 0,1 433,192"/>
    <path d="M 405,235 A 115,115 0 0,1 345,265"/>
    <path d="M 295,265 A 115,115 0 0,1 235,235"/>
    <path d="M 207,192 A 115,115 0 0,1 207,128"/>
    <path d="M 235,75  A 115,115 0 0,1 290,55"/>
  </g>
  <!-- center label: v4.0-cowboy-loop -->
  <text x="320" y="155" text-anchor="middle" fill="#FFE5A0" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="bold">v4.0</text>
  <text x="320" y="172" text-anchor="middle" fill="#FF9A3C" font-family="ui-sans-serif,system-ui" font-size="10" font-style="italic">cowboy-loop</text>
  <text x="320" y="186" text-anchor="middle" fill="#D1FAE5" font-family="ui-monospace,monospace" font-size="8">405 tests</text>
  <!-- title -->
  <text x="320" y="20" text-anchor="middle" fill="#FFE5A0" font-family="ui-sans-serif,system-ui" font-size="13" font-weight="600">THE COWBOY LOOP</text>
  <text x="320" y="305" text-anchor="middle" fill="#FF9A3C" font-family="ui-sans-serif,system-ui" font-size="9" font-style="italic">pincher → substrate → saddle → cowboy → reactor → witness → pincher</text>
</svg>
